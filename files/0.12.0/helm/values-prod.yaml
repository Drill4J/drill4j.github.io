# Example production overrides: ingress, 2 admin replicas, larger volumes.
#   helm install drill ./drill -f values-prod.yaml --set ingress.host=drill.example.com
# For an external PostgreSQL add:
#   --set postgresql.enabled=false --set externalDatabase.host=... --set externalDatabase.existingSecret=...
exposure:
  mode: ingress

ingress:
  className: ""          # set to the ingress class of your cluster
  host: drill.example.com
  tls:
    - secretName: drill-tls
      hosts: [drill.example.com]

admin:
  replicaCount: 2
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      memory: 4Gi

ui:
  replicaCount: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

postgresql:
  persistence:
    size: 50Gi
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      memory: 4Gi

backup:
  enabled: false
