{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "drill.postgresqlName" . }}
  labels:
    {{- include "drill.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  selector:
    {{- include "drill.selectorLabels" (dict "ctx" . "component" "postgresql") | nindent 4 }}
  ports:
    - name: postgresql
      port: {{ .Values.postgresql.port }}
      targetPort: postgresql
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "drill.postgresqlName" . }}-headless
  labels:
    {{- include "drill.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  clusterIP: None
  selector:
    {{- include "drill.selectorLabels" (dict "ctx" . "component" "postgresql") | nindent 4 }}
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
{{- end }}
