{{- if eq .Values.exposure.mode "ingress" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "drill.fullname" . }}
  labels:
    {{- include "drill.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- if .Values.admin.enabled }}
          {{- range list "/api" "/swagger" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "drill.adminName" $ }}
                port:
                  name: http
          {{- end }}
          {{- end }}
          {{- if .Values.ui.enabled }}
          - path: {{ .Values.ui.basePath | default "/" }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "drill.uiName" . }}
                port:
                  name: http
          {{- end }}
{{- end }}
