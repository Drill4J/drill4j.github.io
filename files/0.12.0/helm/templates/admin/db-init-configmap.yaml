{{- if and .Values.admin.enabled .Values.admin.dbInit.enabled .Values.postgresql.enabled (or .Values.postgresql.adminUser.enabled .Values.postgresql.hardenPublicRole) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "drill.adminName" . }}-db-init
  labels:
    {{- include "drill.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
data:
  {{- if .Values.postgresql.hardenPublicRole }}
  harden-public-role.sql: |
    {{- .Files.Get "files/db-init/harden-public-role.sql" | nindent 4 }}
  {{- end }}
  {{- if .Values.postgresql.adminUser.enabled }}
  admin-user.sql: |
    {{- .Files.Get "files/db-init/admin-user.sql" | nindent 4 }}
  {{- end }}
{{- end }}
