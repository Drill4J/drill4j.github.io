# This is an example of a more security-conscious configuration, not a fully
# secure deployment or a guarantee of security. Review and adapt it to your
# environment, security requirements, and threat model before use.

services:

  drill-ui:
    image: ghcr.io/drill4j/drill4j-ui:${DRILL_UI_VERSION}
    environment:
      API_HOST: host.docker.internal
      API_PORT: 8090
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8091:8080"

  drill-admin:
    image: ghcr.io/drill4j/admin:${DRILL_ADMIN_BACKEND_VERSION}
    environment:
      - LOG_LEVEL=INFO
      - DRILL_DB_PORT=5432
      - DRILL_DB_HOST=${POSTGRES_HOST}
      - DRILL_DB_NAME=${DRILL_DB_NAME}
      - DRILL_DB_USER_NAME=${DRILL_ADMIN_DB_USER}
      - DRILL_DB_PASSWORD=${DRILL_ADMIN_DB_PASSWORD}
      - DRILL_DB_SSL=${POSTGRES_SSL}
      - DRILL_DB_MAX_POOL_SIZE=${DRILL_DB_MAX_POOL_SIZE}
      - DRILL_METRICS_DB_NAME=${DRILL_METRICS_DB_NAME}
      - DRILL_METRICS_DB_MAX_POOL_SIZE=${DRILL_METRICS_DB_MAX_POOL_SIZE}
      - DRILL_SCHEDULER_ETL_JOB_CRON=${DRILL_SCHEDULER_ETL_JOB_CRON}
      - DRILL_ETL_MAX_WORKERS=${DRILL_ETL_MAX_WORKERS}
      - DRILL_ETL_BATCH_SIZE=${DRILL_ETL_BATCH_SIZE}
      - DRILL_ETL_BUFFER_SIZE=${DRILL_ETL_BUFFER_SIZE}
      - DRILL_ETL_FETCH_SIZE=${DRILL_ETL_FETCH_SIZE}
      - DRILL_ETL_EXTRACTION_LIMIT=${DRILL_ETL_EXTRACTION_LIMIT}
      - DRILL_ETL_CONSISTENCY_WINDOW=${DRILL_ETL_CONSISTENCY_WINDOW}
      - DRILL_ETL_PROCESSING_DELAY=${DRILL_ETL_PROCESSING_DELAY}
      - DRILL_ETL_AGGREGATION_BUFFER_SIZE=${DRILL_ETL_AGGREGATION_BUFFER_SIZE}
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:8090" ]
      interval: 60s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - 8090:8090
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17.0
    shm_size: 1g
    ports:
      - '5432:5432'
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${DRILL_DB_NAME}
      DRILL_METRICS_DB_NAME: ${DRILL_METRICS_DB_NAME}
      DRILL_ADMIN_DB_USER: ${DRILL_ADMIN_DB_USER}
      DRILL_ADMIN_DB_PASSWORD: ${DRILL_ADMIN_DB_PASSWORD}
    entrypoint: ["/ssl-entrypoint.sh"]
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d
      - drill-data-pg:/var/lib/postgresql/data
      - ./ssl:/ssl-src:ro
      - ./ssl-entrypoint.sh:/ssl-entrypoint.sh:ro
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    command:
      - "postgres"
      - "-c"
      - "ssl=on"
      - "-c"
      - "ssl_cert_file=/etc/ssl/certs/pg-server.crt"
      - "-c"
      - "ssl_key_file=/etc/ssl/private/pg-server.key"
      - "-c"
      - "hba_file=/etc/postgresql/pg_hba.conf"
      - "-c"
      - "log_statement=all"
      - "-c"
      - "log_min_duration_statement=0"

volumes:
  drill-data-pg:
