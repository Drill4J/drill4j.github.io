{{- if .Values.ui.enabled }}
{{- $u := .Values.ui -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "drill.uiName" . }}
  labels:
    {{- include "drill.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ $u.replicaCount }}
  selector:
    matchLabels:
      {{- include "drill.selectorLabels" (dict "ctx" . "component" "ui") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "drill.selectorLabels" (dict "ctx" . "component" "ui") | nindent 8 }}
      {{- with $u.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "drill.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: ui
          image: {{ include "drill.image" (dict "ctx" . "image" $u.image) }}
          imagePullPolicy: {{ $u.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            # nginx in the UI image proxies /api/ to API_HOST:API_PORT
            - name: API_HOST
              value: {{ $u.apiHost | default (include "drill.adminName" .) | quote }}
            - name: API_PORT
              value: {{ $u.apiPort | default .Values.admin.service.port | toString | quote }}
            - name: BASE_PATH
              value: {{ $u.basePath | quote }}
            {{- with $u.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if $u.preStopSleepSeconds }}
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ $u.preStopSleepSeconds }}"]
          {{- end }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
          {{- with $u.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with $u.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $u.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $u.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
