{{- if .Values.ui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "drill.uiName" . }}
  labels:
    {{- include "drill.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: {{ ternary "NodePort" "ClusterIP" (eq .Values.exposure.mode "local") }}
  selector:
    {{- include "drill.selectorLabels" (dict "ctx" . "component" "ui") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: http
      {{- if and (eq .Values.exposure.mode "local") .Values.ui.service.nodePort }}
      nodePort: {{ .Values.ui.service.nodePort }}
      {{- end }}
{{- end }}
