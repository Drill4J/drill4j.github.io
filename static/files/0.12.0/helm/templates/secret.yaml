{{- $dbSecretManaged := not (include "drill.db.existingSecret" .) -}}
{{- $jwtSecretManaged := and .Values.admin.enabled (not .Values.admin.jwt.existingSecret) -}}
{{- if or $dbSecretManaged $jwtSecretManaged }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace (include "drill.fullname" .)).data | default (dict) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "drill.fullname" . }}
  labels:
    {{- include "drill.labels" . | nindent 4 }}
  annotations:
    # Kept on uninstall: the password must keep matching the data in the PostgreSQL volume.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $dbSecretManaged }}
  {{- $key := include "drill.db.passwordKey" . }}
  {{- $given := ternary .Values.postgresql.auth.password .Values.externalDatabase.password .Values.postgresql.enabled }}
  {{- if $given }}
  {{ $key }}: {{ $given | b64enc | quote }}
  {{- else if hasKey $existing $key }}
  {{ $key }}: {{ index $existing $key | quote }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 24 | b64enc | quote }}
  {{- end }}
  {{- if include "drill.adminUser.enabled" . }}
  {{- $key := .Values.postgresql.adminUser.passwordKey }}
  {{- if .Values.postgresql.adminUser.password }}
  {{ $key }}: {{ .Values.postgresql.adminUser.password | b64enc | quote }}
  {{- else if hasKey $existing $key }}
  {{ $key }}: {{ index $existing $key | quote }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 24 | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if $jwtSecretManaged }}
  {{- $key := .Values.admin.jwt.secretKey }}
  {{- if .Values.admin.jwt.secret }}
  {{ $key }}: {{ .Values.admin.jwt.secret | b64enc | quote }}
  {{- else if hasKey $existing $key }}
  {{ $key }}: {{ index $existing $key | quote }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
