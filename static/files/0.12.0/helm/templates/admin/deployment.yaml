{{- if .Values.admin.enabled }}
{{- $a := .Values.admin -}}
{{- $adminUser := include "drill.adminUser.enabled" . -}}
{{- $harden := and .Values.postgresql.enabled .Values.postgresql.hardenPublicRole -}}
{{- $dbInitSql := and $a.dbInit.enabled (or $adminUser $harden) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "drill.adminName" . }}
  labels:
    {{- include "drill.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  replicas: {{ $a.replicaCount }}
  strategy:
    {{- if eq $a.updateStrategy.type "Recreate" }}
    type: Recreate
    {{- else }}
    {{- toYaml $a.updateStrategy | nindent 4 }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "drill.selectorLabels" (dict "ctx" . "component" "admin") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "drill.selectorLabels" (dict "ctx" . "component" "admin") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/admin/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- if $dbInitSql }}
        checksum/db-init: {{ include (print $.Template.BasePath "/admin/db-init-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with $a.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "drill.imagePullSecrets" . | nindent 6 }}
      initContainers:
        - name: wait-db
          image: {{ include "drill.pgClientImage" . }}
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              until pg_isready -q; do echo "waiting for $PGHOST:$PGPORT"; sleep 2; done
              until PGHOST="$M_PGHOST" PGPORT="$M_PGPORT" PGUSER="$M_PGUSER" pg_isready -q; do echo "waiting for $M_PGHOST:$M_PGPORT"; sleep 2; done
          env:
            {{- include "drill.pgEnv" . | nindent 12 }}
            {{- include "drill.pgMetricsEnv" . | nindent 12 }}
        {{- if $a.dbInit.enabled }}
        - name: db-init
          image: {{ include "drill.pgClientImage" . }}
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              set -e
              # create_db <db> <host> <port> <user> <password> <sslmode>
              # Runs in a subshell: the exported PG* variables do not leak into the steps below.
              create_db() (
                export PGHOST="$2" PGPORT="$3" PGUSER="$4" PGPASSWORD="$5" PGSSLMODE="$6"
                q="SELECT 1 FROM pg_database WHERE datname = '$1'"
                if [ "$(psql -d "$MAINT_DB" -tAc "$q")" = "1" ]; then
                  echo "database \"$1\" exists"; exit 0
                fi
                echo "creating database \"$1\""
                # Another replica may create it at the same time: re-check on failure.
                psql -d "$MAINT_DB" -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"$1\"" \
                  || [ "$(psql -d "$MAINT_DB" -tAc "$q")" = "1" ]
              )
              create_db "$DB_NAME" "$PGHOST" "$PGPORT" "$PGUSER" "$PGPASSWORD" "$PGSSLMODE"
              create_db "$METRICS_DB_NAME" "$M_PGHOST" "$M_PGPORT" "$M_PGUSER" "$M_PGPASSWORD" "$M_PGSSLMODE"
              {{- if $harden }}
              for db in "$DB_NAME" "$METRICS_DB_NAME"; do
                echo "revoking default PUBLIC privileges in \"$db\""
                psql -X -q -d "$db" -v ON_ERROR_STOP=1 -f /db-init/harden-public-role.sql
              done
              {{- end }}
              {{- if $adminUser }}
              echo "configuring role \"$ADMIN_DB_USER\""
              # Another replica may run it at the same time: retry once.
              psql -X -q -d "$MAINT_DB" -v ON_ERROR_STOP=1 -f /db-init/admin-user.sql \
                || { sleep 2; psql -X -q -d "$MAINT_DB" -v ON_ERROR_STOP=1 -f /db-init/admin-user.sql; }
              {{- end }}
          env:
            {{- include "drill.pgEnv" . | nindent 12 }}
            {{- include "drill.pgMetricsEnv" . | nindent 12 }}
            - name: MAINT_DB
              value: {{ $a.dbInit.maintenanceDatabase | quote }}
            - name: DB_NAME
              value: {{ include "drill.db.name" . | quote }}
            - name: METRICS_DB_NAME
              value: {{ include "drill.db.metricsName" . | quote }}
            {{- if $adminUser }}
            - name: ADMIN_DB_USER
              value: {{ include "drill.admin.db.user" . | quote }}
            - name: ADMIN_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "drill.db.secretName" . }}
                  key: {{ include "drill.admin.db.passwordKey" . }}
            {{- end }}
          {{- if $dbInitSql }}
          volumeMounts:
            - name: db-init
              mountPath: /db-init
              readOnly: true
          {{- end }}
        {{- end }}
      containers:
        - name: admin
          image: {{ include "drill.image" (dict "ctx" . "image" $a.image) }}
          imagePullPolicy: {{ $a.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8090
          envFrom:
            - configMapRef:
                name: {{ include "drill.adminName" . }}
            {{- with $a.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: DRILL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "drill.db.secretName" . }}
                  key: {{ include "drill.admin.db.passwordKey" . }}
            {{- with (include "drill.db.metrics" . | fromYaml).passwordKey }}
            - name: DRILL_METRICS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "drill.db.secretName" $ }}
                  key: {{ . }}
            {{- end }}
            - name: DRILL_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "drill.jwt.secretName" . }}
                  key: {{ $a.jwt.secretKey }}
            {{- with $a.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- /* Useful only while other admin pods keep serving; with Recreate and 1 replica it just adds downtime. */}}
          {{- if and $a.preStopSleepSeconds (or (ne $a.updateStrategy.type "Recreate") (gt (int $a.replicaCount) 1)) }}
          # admin closes its port on SIGTERM at once; wait until the pod is removed from Service endpoints.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ $a.preStopSleepSeconds }}"]
          {{- end }}
          startupProbe:
            httpGet:
              path: {{ $a.probes.path }}
              port: http
            periodSeconds: {{ $a.startupProbe.periodSeconds }}
            failureThreshold: {{ $a.startupProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ $a.probes.path }}
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ $a.probes.path }}
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          {{- with $a.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $a.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if or $a.extraVolumes $dbInitSql }}
      volumes:
        {{- if $dbInitSql }}
        - name: db-init
          configMap:
            name: {{ include "drill.adminName" . }}-db-init
        {{- end }}
        {{- with $a.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with $a.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $a.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $a.affinity }}
      affinity:
        {{- toYaml $a.affinity | nindent 8 }}
      {{- else if gt (int $a.replicaCount) 1 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "drill.selectorLabels" (dict "ctx" . "component" "admin") | nindent 20 }}
      {{- end }}
{{- end }}
