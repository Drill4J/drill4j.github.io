{{- if and .Values.admin.enabled (gt (int .Values.admin.replicaCount) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "drill.adminName" . }}
  labels:
    {{- include "drill.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  minAvailable: {{ .Values.admin.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "drill.selectorLabels" (dict "ctx" . "component" "admin") | nindent 6 }}
{{- end }}
