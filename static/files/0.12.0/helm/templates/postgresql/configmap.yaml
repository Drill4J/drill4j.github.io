{{- if and .Values.postgresql.enabled .Values.postgresql.tls.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "drill.postgresqlName" . }}
  labels:
    {{- include "drill.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
data:
  pg_hba.conf: |
    {{- .Files.Get "files/postgresql/pg_hba.conf" | nindent 4 }}
{{- end }}
