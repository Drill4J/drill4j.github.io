{{- if and (include "drill.backup.enabled" .) (include "drill.backup.pvcReady" .) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "drill.backupName" . }}
  labels:
    {{- include "drill.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
  annotations:
    # Runs before new manifests are applied; a failure aborts the upgrade/rollback.
    helm.sh/hook: pre-upgrade,pre-rollback
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.backup.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "drill.selectorLabels" (dict "ctx" . "component" "backup") | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- include "drill.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: backup
          image: {{ include "drill.backupImage" . }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -e
              DIR="/backups/$(date -u +%Y%m%d-%H%M%S)"
              mkdir -p "$DIR"
              # Versions of the release being replaced are unknown here; record what is being deployed.
              printf 'release=%s\nnamespace=%s\ntarget_chart=%s\ntarget_admin=%s\n' \
                {{ .Release.Name | quote }} {{ .Release.Namespace | quote }} {{ .Chart.Version | quote }} {{ .Values.admin.image.tag | quote }} > "$DIR/info"
              echo "dumping $DB_NAME"
              pg_dump -Fc -d "$DB_NAME" -f "$DIR/$DB_NAME.dump"
              echo "dumping $METRICS_DB_NAME"
              PGHOST="$M_PGHOST" PGPORT="$M_PGPORT" PGUSER="$M_PGUSER" PGPASSWORD="$M_PGPASSWORD" PGSSLMODE="$M_PGSSLMODE" \
                pg_dump -Fc -d "$METRICS_DB_NAME" -f "$DIR/$METRICS_DB_NAME.dump"
              # Keep the newest $KEEP backups.
              ls -1d /backups/2???????-?????? | sort -r | tail -n +$((KEEP + 1)) | xargs -r rm -rf
              ls -l /backups
          env:
            {{- include "drill.pgEnv" . | nindent 12 }}
            {{- include "drill.pgMetricsEnv" . | nindent 12 }}
            - name: DB_NAME
              value: {{ include "drill.db.name" . | quote }}
            - name: METRICS_DB_NAME
              value: {{ include "drill.db.metricsName" . | quote }}
            - name: KEEP
              value: {{ .Values.backup.keep | quote }}
          {{- with .Values.backup.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: backups
              mountPath: /backups
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: {{ .Values.backup.persistence.existingClaim | default (include "drill.backupName" .) }}
{{- end }}
