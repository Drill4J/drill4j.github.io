services:

  drill-ui:
    image: ghcr.io/drill4j/drill4j-ui:${DRILL_UI_VERSION}
    environment:
      API_HOST: host.docker.internal
      API_PORT: 8090
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8091:8080"

  drill-admin:
    image: ghcr.io/drill4j/admin:${DRILL_ADMIN_BACKEND_VERSION}
    environment:
      - LOG_LEVEL=info
      - DRILL_DB_PORT=5432
      - DRILL_DB_HOST=${POSTGRES_HOST}
      - DRILL_DB_NAME=${DRILL_DB_NAME}
      - DRILL_DB_USER_NAME=${POSTGRES_USER}
      - DRILL_DB_PASSWORD=${POSTGRES_PASSWORD}
      - DRILL_DB_SSL=${POSTGRES_SSL}
      - DRILL_DB_MAX_POOL_SIZE=${DRILL_DB_MAX_POOL_SIZE}
      - DRILL_METRICS_DB_NAME=${DRILL_METRICS_DB_NAME}
      - DRILL_METRICS_UI_BASE_URL=${DRILL_METRICS_UI_BASE_URL}
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:8090" ]
      interval: 60s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - 8090:8090
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17.0
    shm_size: 1g
    ports:
      - '5432:5432'
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${DRILL_DB_NAME}
      DRILL_METRICS_DB_NAME: ${DRILL_METRICS_DB_NAME}
    volumes:
      # Volume to initialize postgres with required databases and data (see "db-init" folder)
      - ./db-init:/docker-entrypoint-initdb.d
      # Volume to store data
      - drill-data-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    command: ["postgres", "-c", "log_statement=all", "-c", "log_min_duration_statement=0"]

volumes:
  drill-data-pg:
